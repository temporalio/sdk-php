name: temporal-bench

services:
  postgresql:
    image: postgres:16
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    command: >
      postgres
      -c max_connections=500
      -c fsync=off
      -c synchronous_commit=off
      -c full_page_writes=off
      -c shared_buffers=512MB
    tmpfs:
      - /var/lib/postgresql/data

  temporal:
    image: temporalio/auto-setup:1.29.3
    depends_on:
      - postgresql
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: postgresql
      NUM_HISTORY_SHARDS: 512
      SQL_MAX_CONNS: 100
      SQL_MAX_IDLE_CONNS: 100
      DYNAMIC_CONFIG_FILE_PATH: /etc/temporal/config/dynamicconfig/bench.yaml
      LOG_LEVEL: error
    volumes:
      - ./dynamicconfig.yaml:/etc/temporal/config/dynamicconfig/bench.yaml:ro
    ports:
      - "127.0.0.1:7557:7233"

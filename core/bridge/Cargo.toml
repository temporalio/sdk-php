[package]
name = "temporal-php-bridge"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "temporal_php_bridge"
crate-type = ["cdylib"]

[dependencies]
base64 = "0.22"
libc = "0.2"
mimalloc = { version = "0.1", default-features = false }
futures-util = "0.3"
prost = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", default-features = false, features = ["rt", "sync", "time"] }
tonic = { version = "0.14", default-features = false, features = ["channel", "codegen", "tls-ring", "tls-native-roots"] }
temporalio-sdk-core = "0.9.0"
temporalio-client = "1.0.0"
temporalio-common = { version = "1.0.0", features = ["core-based-sdk"] }

[build-dependencies]
cbindgen = { version = "0.29", default-features = false }

[profile.release]
strip = "debuginfo"
lto = "fat"
codegen-units = 1
